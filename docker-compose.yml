# AgriAura - production stack: PostgreSQL + Django (gunicorn) + dedicated weather scheduler + nginx/React + backups.
#   cp .env.example .env   (fill in the passwords/secret)   ->   docker compose up -d --build
name: agriaura

x-backend-env: &backend-env
  DJANGO_DEBUG: "False"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost},localhost,127.0.0.1,backend
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_HTTPS: ${DJANGO_HTTPS:-False}
  DJANGO_TIME_ZONE: ${TZ:-Asia/Kolkata}
  TZ: ${TZ:-Asia/Kolkata}
  DATABASE_URL: postgres://${POSTGRES_USER:-agriaura}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-agriaura}
  DEMO_AUTOSEED: "False"
  SCHEDULER_AUTOSTART: "False"          # the `scheduler` service owns the schedule, not the web workers
  WEATHER_SYNC_INTERVAL_MINUTES: ${WEATHER_SYNC_INTERVAL_MINUTES:-60}
  WEATHER_SYNC_MAX_RETRIES: ${WEATHER_SYNC_MAX_RETRIES:-3}
  OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-}   # optional; empty = public Open-Meteo
  OPEN_METEO_ARCHIVE_URL: ${OPEN_METEO_ARCHIVE_URL:-}
  OPEN_METEO_TIMEOUT_SECONDS: ${OPEN_METEO_TIMEOUT_SECONDS:-}
  OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agriaura}
      POSTGRES_USER: ${POSTGRES_USER:-agriaura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${PGDATA_PATH:-pgdata}:/var/lib/postgresql/data     # point PGDATA_PATH at the data-centre storage mount
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: agriaura-backend:latest
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./exchange:/exchange        # drop station CSVs here; validation reports are written here
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s

  scheduler:
    image: agriaura-backend:latest
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  web:
    build: ./frontend
    image: agriaura-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agriaura}
      POSTGRES_DB: ${POSTGRES_DB:-agriaura}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_PATH:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
